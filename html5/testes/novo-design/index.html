#round{position:absolute;left:742px;top:58px;width:124px;height:40px;display:grid;place-items:center;font-weight:700;font-size:27px;color:#efdcb2;text-shadow:0 2px 0 #000a}
/* Cartas: a arte é a da referência; custo e texto seguem as regras atuais do jogo */
.card{position:absolute;top:606px;font-family:inherit;height:262px;border:0;padding:0;background:transparent;cursor:pointer;border-radius:12px;transition:transform .12s,filter .12s,box-shadow .12s}
.card:hover:not(:disabled){transform:translateY(-6px);filter:brightness(1.08)}
.card.sel{transform:translateY(-12px);box-shadow:0 0 0 3px #f6cd6a,0 0 28px 6px #f2b84a99}
.card:disabled{filter:grayscale(.75) brightness(.55);cursor:default}
.card .cost{position:absolute;left:12px;top:7px;width:24px;height:30px;font-weight:800;font-size:30px;line-height:30px;text-align:center;color:#f3e3c2;text-shadow:0 2px 0 #0009}
.card .desc{position:absolute;left:15px;right:15px;top:166px;height:82px;display:grid;place-items:center;text-align:center;font-weight:500;font-size:16px;line-height:1.18;color:#3a2716}
.card .key{position:absolute;right:13px;top:11px;font-size:13px;font-weight:700;color:#f3e3c2aa}
/* Ordem de iniciativa */
#order{position:absolute;left:1296px;top:132px;width:290px;display:flex;flex-direction:column;gap:8px}
.oi{position:relative;height:58px;margin-left:16px;display:flex;align-items:center;gap:12px;padding:0 10px 0 4px;border-radius:7px;background:linear-gradient(180deg,#2b2a2a,#1c1b1c);border:2px solid #5b4a37;box-shadow:inset 0 0 0 1px #0007}
.oi img{width:58px;height:58px;border-radius:50%;margin-left:-10px;border:3px solid #8a6a3c;box-shadow:0 0 0 2px #1a120b;object-fit:cover;background:#222}
.oi span{font-weight:700;font-size:20px;color:#efe1c4;white-space:nowrap}
.oi.now{border-color:#e9b34d;box-shadow:0 0 14px #e9b34d66,inset 0 0 18px #e9b34d22}
.oi.now img{border-color:#e9b34d}
.oi.now::before{content:"";position:absolute;left:-20px;top:17px;border:12px solid transparent;border-left:16px solid #f2c24e;border-right:0;filter:drop-shadow(0 0 4px #f2c24e)}
.oi.dead{opacity:.45}
/* Registro de combate */
#log{position:absolute;left:1300px;top:356px;width:282px;height:176px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;font-size:16.5px;line-height:1.22;color:#e7d9bd}
#log .l{display:flex;gap:9px;align-items:flex-start}
#log .i{flex:none;width:22px;text-align:center;font-size:17px;line-height:20px}
#log b.d{color:#ff6a55;font-weight:700}
#log b.h{color:#8fd29b;font-weight:700}
/* Botões da imagem */
.hot{position:absolute;font-family:inherit;border:0;background:transparent;cursor:pointer;border-radius:8px}
.hot:hover{box-shadow:0 0 0 2px #f2c35a88,0 0 18px #f2c35a55}
.hot:disabled{cursor:default;filter:grayscale(.8) brightness(.6);background:#0005}
#endBtn{left:1315px;top:780px;width:277px;height:70px}
#helpBtn{left:1408px;top:10px;width:48px;height:48px}#gearBtn{left:1473px;top:10px;width:48px;height:48px}#fullBtn{left:1538px;top:10px;width:48px;height:48px}
#drawBtn{left:178px;top:780px;width:143px;height:70px}
/* Avisos e janelas */
#banner{position:absolute;left:50%;top:128px;transform:translateX(-50%);padding:8px 26px;font-weight:800;font-size:30px;letter-spacing:1px;color:#f6e3b8;background:linear-gradient(180deg,#3b2a1acc,#1c130bcc);border:2px solid #b7894a;border-radius:6px;box-shadow:0 6px 18px #000a;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#banner.on{opacity:1}
#banner.enemy{color:#ffd0c4;border-color:#b5523f}
#hint{position:absolute;left:400px;width:840px;top:566px;text-align:center;font-size:17px;color:#e6d4b0;text-shadow:0 2px 3px #000}
#modal{position:absolute;inset:0;display:none;place-items:center;background:#000a;z-index:5}
#modal.on{display:grid}
.mbox{width:620px;padding:26px 30px 24px;text-align:center;background:linear-gradient(180deg,#e8d7b4,#cdb68d);color:#2b1c10;border:3px solid #6e4f2b;border-radius:10px;box-shadow:0 0 0 3px #1a120b,0 20px 50px #000c}
.mbox h2{margin:0 0 10px;font-size:40px;font-weight:800}
.mbox p{margin:8px 0;font-size:19px;line-height:1.35}
.mbox ul{text-align:left;font-size:17px;line-height:1.35;margin:10px 0 0;padding-left:22px}
.mbox button{margin-top:18px;padding:10px 26px;font:700 20px 'Alegreya',Georgia,serif;color:#f6e7c8;background:linear-gradient(180deg,#8a2a22,#5c1712);border:2px solid #d9a64f;border-radius:6px;cursor:pointer}
</style>
</head>

const ex=(a,b,y)=>a[0]+(b[0]-a[0])*(y-a[1])/(b[1]-a[1]);
function pt(c,y){const L=ex(TL,BL,y),R=ex(TR,BR,y);return [L+(R-L)*c/6,y]}
function quad(c,r){const y0=ROWS[r],y1=ROWS[r+1];return [pt(c,y0),pt(c+1,y0),pt(c+1,y1),pt(c,y1)]}
function center(c,r){const y=(ROWS[r]+ROWS[r+1])/2;return pt(c+.5,y)}
function cellW(r){const y=(ROWS[r]+ROWS[r+1])/2;return (ex(TR,BR,y)-ex(TL,BL,y))/6}
// Ponto onde fica o centro da base da miniatura (um pouco abaixo do centro da casa).
function foot(c,r){const [x,y]=center(c,r);return [x,y+(ROWS[r+1]-ROWS[r])*.3]}
const cellName=(c,r)=>COLS[c]+(3-r);
function cellAt(x,y){for(let r=0;r<3;r++)if(y>=ROWS[r]&&y<ROWS[r+1]){const L=ex(TL,BL,y),R=ex(TR,BR,y),c=Math.floor((x-L)/((R-L)/6));return c>=0&&c<6?{c,r}:null}return null}
// ---------- Regras (as mesmas do jogo atual, só Brokk contra o Goblin do Porrete) ----------
const CARDS=[
 {id:'attack',cost:3,x0:345,x1:527,desc:'Golpe com o machado em um inimigo ao lado (diagonal conta).'},
 {id:'defend',cost:1,x0:543,x1:717,desc:'+2 de Defesa até o início do seu próximo turno.'},
 {id:'move',cost:2,x0:733,x1:905,desc:'Move 1 casa, só na horizontal ou vertical.'},
 {id:'run',cost:3,x0:922,x1:1094,desc:'Move até 2 casas, sem atravessar ninguém.'},
 {id:'advantage',cost:5,x0:1113,x1:1290,desc:'Ataque com 2 dados: vale o maior.'}];
const d=n=>1+Math.floor(Math.random()*n);
let S,busy=false,hover=null,fx=[],session=0;
const wait=ms=>{const s=session;return new Promise(r=>setTimeout(()=>{if(s===session)r()},ms))};
function newGame(){session++;busy=false;fx=[];
 S={round:1,turn:null,selected:null,over:false,log:[],
  hero:{key:'brokk',name:'Brokk',c:1,r:1,hp:14,max:14,ap:5,def:1,defending:false,moved:false,alive:true,pos:null},
  gob:{key:'goblin',name:'Goblin do Porrete',c:4,r:1,hp:6,max:6,ap:3,def:0,alive:true,pos:null}};
 for(const u of [S.hero,S.gob])u.pos=foot(u.c,u.r);
 const hi=d(20),gi=d(20);S.hero.init=hi+1;S.gob.init=gi+1;
 // Empate: o inimigo age antes (regra atual do jogo).
 S.order=S.hero.init>S.gob.init?[S.hero,S.gob]:[S.gob,S.hero];
 $('log').innerHTML='';addLog('⚔',`Iniciativa: Brokk ${hi}+1 = <b class="h">${S.hero.init}</b> · Goblin ${gi}+1 = <b class="d">${S.gob.init}</b>.`);
 $('modal').classList.remove('on');render();startTurn(0)}
const alive=u=>u.alive&&u.hp>0;
const adj=(a,b)=>Math.max(Math.abs(a.c-b.c),Math.abs(a.r-b.r))===1;
const free=(c,r)=>c>=0&&c<6&&r>=0&&r<3&&![S.hero,S.gob].some(u=>alive(u)&&u.c===c&&u.r===r);
function paths(u,max){// casas alcançáveis andando na horizontal/vertical por casas livres
 const out=new Map(),q=[[u.c,u.r,[]]],seen=new Set([u.c+','+u.r]);
 while(q.length){const [c,r,p]=q.shift();if(p.length>=max)continue;for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc,nr=r+dr,k=nc+','+nr;if(seen.has(k)||!free(nc,nr))continue;seen.add(k);const np=[...p,[nc,nr]];out.set(k,np);q.push([nc,nr,np])}}
 return out}
function heroTurn(){return S&&!S.over&&!busy&&S.turn===S.hero}
function canUse(card){const h=S.hero;if(!heroTurn()||h.ap<card.cost)return false;
 if(card.id==='attack'||card.id==='advantage')return adj(h,S.gob)&&alive(S.gob);
 if(card.id==='defend')return !h.defending;
 if(card.id==='move'||card.id==='run')return !h.moved&&paths(h,1).size>0;return true}
function targets(){const h=S.hero,sel=S.selected;if(!heroTurn()||!sel)return [];
 if(sel==='move'||sel==='run')return [...paths(h,sel==='move'?1:2).keys()].map(k=>k.split(',').map(Number));
 if((sel==='attack'||sel==='advantage')&&adj(h,S.gob))return [[S.gob.c,S.gob.r]];return []}
// ---------- Interface ----------
function addLog(icon,html){S.log.push({icon,html});const el=$('log');el.innerHTML=S.log.slice(-5).map(e=>`<div class="l"><span class="i">${e.icon}</span><span>${e.html}</span></div>`).join('')}
function banner(text,enemy){const b=$('banner');b.textContent=text;b.className='on'+(enemy?' enemy':'');clearTimeout(b._t);b._t=setTimeout(()=>b.className=enemy?'enemy':'',1300)}

$('cards').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||b.disabled)return;pick(b.dataset.id)});
function pick(id){const card=CARDS.find(c=>c.id===id);if(!card||!canUse(card))return;
 if(id==='defend'){S.hero.ap-=1;S.hero.defending=true;addLog('🛡','Brokk ergue o escudo: <b class="h">+2 de Defesa</b>.');float(S.hero,'+2 DEF','#9fd4ff');S.selected=null;render();autoEnd();return}
 S.selected=S.selected===id?null:id;render()}
// ---------- Ações ----------
async function walk(u,path){busy=true;render();for(const [c,r] of path){const a=u.pos,b=foot(c,r),t0=performance.now(),dur=360;u.anim={a,b,t0,dur};await wait(dur);u.c=c;u.r=r;u.pos=b;u.anim=null}busy=false}
async function attack(att,tgt,adv){busy=true;render();
 const rolls=adv?[d(6),d(6)]:[d(6)],n=Math.max(...rolls),isHero=att===S.hero;att.lunge={to:tgt.pos,t0:performance.now()};await wait(220);
 const roll=adv?`🎲 ${rolls.join(' e ')} → ${n}`:`🎲 ${n}`;
 if(n===1){addLog('⚔',`${isHero?'Brokk':'Goblin'} errou o golpe (${roll}).`);float(tgt,'Errou','#d9d0c0');busy=false;return}
 let def=tgt.def,bonus=0,extra='';
 if(isHero){bonus=3+(n===6?2:0);if(n===6)extra=' +2 machado'}
 else{bonus=1;if(S.hero.defending)def+=2;if(n===2||n===3){def+=2;extra=' · escudo +2 DEF'}}
 const dmg=Math.max(0,n+bonus-def);tgt.hp-=dmg;tgt.flash=performance.now();
 spark(tgt);
 addLog('⚔',`${isHero?'Brokk atacou o Goblin do Porrete':'O Goblin do Porrete atacou Brokk'} (${roll} + ${bonus}${extra} − DEF ${def}: <b class="d">${dmg} de dano</b>).`);
 float(tgt,dmg?`-${dmg}`:'Bloqueado',dmg?'#ff6a55':'#9fd4ff');
 addLog('♥',`${isHero?'Goblin do Porrete':'Brokk'}: ${Math.max(0,tgt.hp)}/${tgt.max} PV.`);
 if(tgt.hp<=0){tgt.alive=false;tgt.deadAt=performance.now()}
 await wait(450);busy=false}
async function clickCell(c,r){if(!heroTurn()||!S.selected)return;const h=S.hero,sel=S.selected;
 if((sel==='attack'||sel==='advantage')&&S.gob.c===c&&S.gob.r===r&&adj(h,S.gob)){h.ap-=sel==='attack'?3:5;S.selected=null;await attack(h,S.gob,sel==='advantage');render();if(checkEnd())return;autoEnd();return}
 if(sel==='move'||sel==='run'){const p=paths(h,sel==='move'?1:2).get(c+','+r);if(!p)return;const from=cellName(h.c,h.r);h.ap-=sel==='move'?2:3;h.moved=true;S.selected=null;await walk(h,p);addLog('🥾',`Brokk se moveu de ${from} para ${cellName(c,r)}.`);render();autoEnd()}}
function autoEnd(){if(heroTurn()&&!CARDS.some(canUse))setTimeout(()=>{if(heroTurn())endTurn()},500)}
function checkEnd(){if(!alive(S.gob)){S.over=true;render();setTimeout(()=>modal('Vitória!','O Goblin do Porrete caiu. As galerias estão livres... por enquanto.'),900);return true}
 if(!alive(S.hero)){S.over=true;render();setTimeout(()=>modal('Derrota','Brokk tombou nas galerias esquecidas.'),900);return true}return false}
function endTurn(){if(!heroTurn())return;S.selected=null;const i=S.order.indexOf(S.turn);startTurn(i+1)}
async function startTurn(i){if(S.over)return;if(i>=S.order.length){i=0;S.round++;addLog('➜',`Início da Rodada ${S.round}.`)}else if(i===0&&S.round===1)addLog('➜','Início da Rodada 1.');
 const u=S.order[i];S.turn=u;
 if(u===S.hero){u.ap=5;u.defending=false;u.moved=false;banner('SEU TURNO');render();return}
 render();banner('VEZ DO GOBLIN',true);busy=true;await wait(900);busy=false;await goblinAI();if(S.over)return;startTurn(i+1)}
async function goblinAI(){const g=S.gob,h=S.hero;g.ap=3;
 if(adj(g,h)){g.ap-=3;await attack(g,h,false);render();checkEnd();return}
 // Anda uma casa na horizontal/vertical na direção do Brokk.
 const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dc,dr])=>[g.c+dc,g.r+dr]).filter(([c,r])=>free(c,r)).sort((a,b)=>dist(a,h)-dist(b,h));
 if(opts.length&&dist(opts[0],h)<dist([g.c,g.r],h)){const from=cellName(g.c,g.r);g.ap-=2;await walk(g,[opts[0]]);addLog('🥾',`O goblin avançou de ${from} para ${cellName(g.c,g.r)}.`);render();await wait(300)}}
const dist=([c,r],u)=>Math.max(Math.abs(c-u.c),Math.abs(r-u.r))+.01*(Math.abs(c-u.c)+Math.abs(r-u.r));
function modal(title,text,rules){$('mbox').innerHTML=`<h2>${title}</h2><p>${text}</p>${rules||''}<button id="again">${rules?'Voltar':'Jogar de novo'}</button>`;$('modal').classList.add('on');$('again').onclick=()=>{$('modal').classList.remove('on');if(!rules)newGame()}}
$('endBtn').onclick=endTurn;$('gearBtn').onclick=newGame;
$('fullBtn').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
$('drawBtn').onclick=()=>banner('COMPRAR CARTAS AINDA NÃO EXISTE');
$('helpBtn').onclick=()=>modal('Como jogar','Teste do novo design: uma fase, Brokk contra o Goblin do Porrete.','<ul><li><b>Turno:</b> 5 PA. As cartas custam o que está no canto delas.</li><li><b>Ataque (3 PA):</b> 1d6 + 3. Tirou 1, errou. Tirou 6, +2 do machado.</li><li><b>Vantagem (5 PA):</b> ataque com 2 dados, vale o maior.</li><li><b>Defender (1 PA):</b> +2 de Defesa até o seu próximo turno.</li><li><b>Mover (2 PA) / Correr (3 PA):</b> 1 ou 2 casas na horizontal ou vertical. Só um deslocamento por turno.</li><li><b>Escudo:</b> se o goblin tirar 2 ou 3, Brokk ganha +2 de Defesa no golpe.</li><li><b>Atalhos:</b> 1–5 escolhem a carta, Esc cancela, Enter finaliza o turno.</li></ul>');
addEventListener('keydown',e=>{if(e.key==='Escape'&&S){S.selected=null;render()}if(!S||!heroTurn())return;if(e.key>='1'&&e.key<='5')pick(CARDS[+e.key-1].id);if(e.key==='Enter')endTurn()});
function toStage(e){const r=stage.getBoundingClientRect(),k=+stage.dataset.k;return [(e.clientX-r.left)/k,(e.clientY-r.top)/k]}
function unitAt(x,y){for(const u of [S.gob,S.hero]){if(!alive(u))continue;const [fx_,fy]=u.pos,s=cellW(u.r)/128;if(x>fx_-60*s&&x<fx_+60*s&&y>fy-190*s&&y<fy+18*s)return u}return null}
cv.addEventListener('mousemove',e=>{const [x,y]=toStage(e);const u=unitAt(x,y);hover=u?{c:u.c,r:u.r}:cellAt(x,y);cv.style.cursor=hover&&targets().some(([c,r])=>c===hover.c&&r===hover.r)?'pointer':'default'});
cv.addEventListener('mouseleave',()=>hover=null);
cv.addEventListener('click',e=>{const [x,y]=toStage(e);const u=unitAt(x,y),cell=u?{c:u.c,r:u.r}:cellAt(x,y);if(cell)clickCell(cell.c,cell.r)});
// ---------- Efeitos ----------
function float(u,text,color){fx.push({type:'txt',x:u.pos[0],y:u.pos[1]-120*cellW(u.r)/128,text,color,t0:performance.now()})}
function spark(u){const [x,y]=u.pos,s=cellW(u.r)/128;for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*4;fx.push({type:'p',x:x-10*s,y:y-95*s,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,t0:performance.now()})}fx.push({type:'star',x:x-10*s,y:y-95*s,t0:performance.now()})}
function path(q){ctx.beginPath();q.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()}
function arrow(a,b){const mx=(a[0]+b[0])/2,my=Math.min(a[1],b[1])-60;ctx.save();ctx.strokeStyle='#f6dfa8';ctx.lineWidth=5;ctx.setLineDash([16,11]);ctx.shadowColor='#f2c35a';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo(mx,my,b[0],b[1]);ctx.stroke();ctx.setLineDash([]);
 const ang=Math.atan2(b[1]-my,b[0]-mx);ctx.fillStyle='#f6dfa8';ctx.beginPath();ctx.moveTo(b[0]+Math.cos(ang)*6,b[1]+Math.sin(ang)*6);ctx.lineTo(b[0]-Math.cos(ang-.5)*22,b[1]-Math.sin(ang-.5)*22);ctx.lineTo(b[0]-Math.cos(ang+.5)*22,b[1]-Math.sin(ang+.5)*22);ctx.closePath();ctx.fill();ctx.restore()}
function draw(now){requestAnimationFrame(draw);ctx.clearRect(0,0,1600,900);if(!S)return;const h=S.hero,g=S.gob;
 // Casa de quem está na vez: contorno dourado com brilho (herói) ou anel vermelho sob a base (goblin).
 if(!S.over&&S.turn===h&&!h.anim){ctx.save();path(quad(h.c,h.r));ctx.fillStyle='rgba(255,196,90,.10)';ctx.fill();ctx.strokeStyle='#f5c450';ctx.lineWidth=3;ctx.shadowColor='#f5b33a';ctx.shadowBlur=16;ctx.stroke();ctx.restore()}
 const T=targets();const pulse=.75+.25*Math.sin(now/300);
 for(const [c,r] of T){if(c===g.c&&r===g.r)continue;const hv=hover&&hover.c===c&&hover.r===r;ctx.save();path(quad(c,r));ctx.fillStyle=`rgba(255,220,150,${(hv?.26:.13)*pulse})`;ctx.fill();ctx.strokeStyle=`rgba(255,215,140,${hv?.85:.45})`;ctx.lineWidth=2;ctx.shadowColor='#f2c35a';ctx.shadowBlur=hv?14:6;ctx.stroke();ctx.restore()}
 const atkT=T.some(([c,r])=>c===g.c&&r===g.r);
 if(alive(g)&&(atkT||(S.turn===g&&!S.over))){const s=cellW(g.r)/128,[x,y]=g.pos;ctx.save();ctx.strokeStyle=`rgba(255,70,50,${.65+.3*pulse})`;ctx.lineWidth=4;ctx.shadowColor='#ff3b2a';ctx.shadowBlur=18;ctx.beginPath();ctx.ellipse(x,y-6*s,66*s,20*s,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
 // Seta tracejada do Brokk até a casa ou o alvo sob o mouse.
 if(hover&&T.some(([c,r])=>c===hover.c&&r===hover.r)){const a=[h.pos[0]+30,h.pos[1]-40],b=(hover.c===g.c&&hover.r===g.r)?[g.pos[0]-40,g.pos[1]-90*cellW(g.r)/128]:foot(hover.c,hover.r);arrow(a,b)}
 // Miniaturas, de trás para frente.
 for(const u of [h,g].filter(u=>alive(u)||(u.deadAt&&now-u.deadAt<1400)).sort((a,b)=>a.pos[1]-b.pos[1])){
  let [x,y]=u.pos;const sc=cellW(u.anim?Math.min(u.r,2):u.r)/128;
  if(u.anim){const k=Math.min(1,(now-u.anim.t0)/u.anim.dur);x=u.anim.a[0]+(u.anim.b[0]-u.anim.a[0])*k;y=u.anim.a[1]+(u.anim.b[1]-u.anim.a[1])*k-Math.sin(k*Math.PI)*16}
  if(u.lunge){const k=(now-u.lunge.t0)/360;if(k>=1)u.lunge=null;else{const m=Math.sin(k*Math.PI)*.22;x+=(u.lunge.to[0]-x)*m;y+=(u.lunge.to[1]-y)*m}}
  if(u.flash&&now-u.flash<260)x+=Math.sin(now/18)*5;
  const im=IMG[u.key];if(!im.complete)continue;const w=im.width*sc,hh=im.height*sc,ax=u.key==='brokk'?85:85,ay=u.key==='brokk'?195:152;
  ctx.save();if(u.flash&&now-u.flash<260)ctx.filter='brightness(1.5) sepia(.8) saturate(4) hue-rotate(-35deg)';if(!alive(u)){const k=Math.min(1,(now-u.deadAt)/1400);ctx.globalAlpha=1-k;ctx.translate(x,y);ctx.rotate(k*.5);ctx.translate(-x,-y)}
  ctx.drawImage(im,x-ax*sc,y-ay*sc,w,hh);
  ctx.restore()}
 // Faíscas e números.
 fx=fx.filter(f=>now-f.t0<(f.type==='txt'?1200:f.type==='star'?380:600));
 for(const f of fx){const k=(now-f.t0)/1000;ctx.save();
  if(f.type==='p'){ctx.globalAlpha=Math.max(0,1-k/.6);ctx.fillStyle=k<.2?'#fff3b0':'#ffae3c';ctx.beginPath();ctx.arc(f.x+f.vx*k*60,f.y+f.vy*k*60+60*k*k,2.6,0,7);ctx.fill()}
  else if(f.type==='star'){const r=10+90*k;ctx.globalAlpha=1-k/.38;ctx.translate(f.x,f.y);ctx.fillStyle='#fff6c8';ctx.shadowColor='#ffb02e';ctx.shadowBlur=30;ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,rr=i%2?r*.22:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
  else{ctx.globalAlpha=Math.min(1,(1.2-k)*2);ctx.font="800 40px Alegreya, Georgia, serif";ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#1a0e08';ctx.strokeText(f.text,f.x,f.y-k*40);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y-k*40)}
  ctx.restore()}}
requestAnimationFrame(draw);
window.__teste={get:()=>S&&{turn:S.turn===S.hero?'hero':'goblin',over:S.over,round:S.round,hero:{c:S.hero.c,r:S.hero.r,hp:S.hero.hp,ap:S.hero.ap},gob:{c:S.gob.c,r:S.gob.r,hp:S.gob.hp},busy},pick,clickCell,endTurn};
newGame();
})();
</script>
