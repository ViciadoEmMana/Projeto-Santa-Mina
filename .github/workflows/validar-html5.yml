name: 🧪 Validar Santa Mina HTML5
on:
  pull_request:
    branches: [main]
    paths:
      - 'html5/principal/index.html'
      - 'tests/verificar_html5.js'
      - '.github/workflows/validar-html5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/verificar_html5.js
