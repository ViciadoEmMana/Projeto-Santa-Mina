name: 🎮 Publicar Santa Mina HTML5

on:
  push:
    branches: [main]
    paths:
      - 'html5/**'
      - '.github/workflows/publicar-html5.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos HTML5
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./html5
      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
